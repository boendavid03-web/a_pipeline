isaacsim.replicator.agent:
  version: 1.6.0
  # Overridden by generate_free_space_people_config.py for each launch.
  seed: 7
  simulation_duration: 86400.0
  environment:
    # Project-owned Z-up/metre scene. Its NavMesh and floor are bounded to the
    # Gazebo map's 0..32 x 0..24 m interior, so IRA cannot leave the map.
    base_stage_asset_path: ../../scenes/a_pipeline_eng_lobby.usda
  character:
    motion_library_path: Isaac/People/MotionLibrary/HumanMotionLibrary.usd
    groups:
      bookshop_to_coffee:
        # Canonical Gazebo eng_hall_15.xml population weights are retained in
        # this template.  The launcher scales [5,5,2,1,1,1] to the requested
        # total and emits one deterministic-speed IRA group per person.
        num: 5
        asset_path: Isaac/People/Characters/
        routines:
          - patrol:
              weight: 1
              repeat: 1
              speed_range: [0.9, 1.1]
              # These are collision-free corridors generated from the same
              # static-box map that Gazebo uses.  Do not replace them with
              # direct links between the old area-waypoint centres: several
              # of those centres are inside walls and cause visual clipping.
              path_points:
                - [25.0, 9.0, 0.0]
                - [22.75, 11.5, 0.0]
                - [22.25, 12.5, 0.0]
                - [22.25, 15.75, 0.0]
