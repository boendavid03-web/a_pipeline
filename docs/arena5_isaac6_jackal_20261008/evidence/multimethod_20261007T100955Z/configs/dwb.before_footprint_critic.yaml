controller_plugins:
  - FollowPath
controller_plugins_dict:
  FollowPath:
    plugin: "dwb_core::DWBLocalPlanner"
    debug_trajectory_details: True
    min_vel_x: ${min_linear_vel:-0.0}
    min_vel_y: ${min_lateral_vel:-0.0}
    max_vel_x: ${max_linear_vel:-0.26}
    max_vel_y: ${max_lateral_vel:-0.0}
    max_vel_theta: ${max_angular_vel:-1.0}
    min_speed_xy: 0.0
    max_speed_xy: ${max_linear_vel:-0.26}
    min_speed_theta: 0.0
    acc_lim_x: ${linear_acc:-2.5}
    acc_lim_y: ${lateral_acc:-0.0}
    acc_lim_theta: ${angular_acc:-3.2}
    decel_lim_x: ${linear_decel:--2.5}
    decel_lim_y: ${lateral_decel:-0.0}
    decel_lim_theta: ${angular_decel:--3.2}
    vx_samples: 20
    vy_samples: 5
    vtheta_samples: 20
    sim_time: 1.2
    linear_granularity: 0.05
    angular_granularity: 0.025
    transform_tolerance: 0.2
    xy_goal_tolerance: 0.25
    trans_stopped_velocity: 0.25
    short_circuit_trajectory_evaluation: True
    stateful: True
    critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
    BaseObstacle.scale: 0.02
    PathAlign.scale: 32.0
    PathAlign.forward_point_distance: 0.1
    GoalAlign.scale: 24.0
    GoalAlign.forward_point_distance: 0.1
    PathDist.scale: 32.0
    GoalDist.scale: 24.0
    RotateToGoal.scale: 32.0
    RotateToGoal.slowing_factor: 5.0
    RotateToGoal.lookahead_time: -1.0